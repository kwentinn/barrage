<!doctype html><meta charset="utf-8"><title>harness</title>
<body style="font:16px system-ui"><p>Page de test (simule instagram.com)</p>
<script>
  // faux stockage d'extension + confirm automatique + faux cookie csrf
  const mem = {};
  window.chrome = { storage: { local: {
    get: async (k) => Object.fromEntries(k.filter((x) => x in mem).map((x) => [x, JSON.parse(mem[x])])),
    set: async (o) => { for (const [k, v] of Object.entries(o)) mem[k] = JSON.stringify(v); },
  } } };
  window.__mem = mem; window.confirm = () => true;
  document.cookie = "csrftoken=test";
</script>
<script src="../extension/core.js"></script>
<script src="../extension/content.js"></script>
